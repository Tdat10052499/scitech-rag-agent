# nginx of the Space (deploy/hf-space): the UI and the API on one origin, like frontend/nginx.conf
# (ADR 0004), with request limits that protect the hosted LLM's free quota. Runs as uid 1000, so
# every temp path is under /app/run.
worker_processes 1;
pid /app/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log off;   # no per-visitor log in a public deployment
    client_body_temp_path /app/run/body;
    proxy_temp_path /app/run/proxy;
    fastcgi_temp_path /app/run/fastcgi;
    uwsgi_temp_path /app/run/uwsgi;
    scgi_temp_path /app/run/scgi;
    client_max_body_size 64k;

    # The Space proxy puts the visitor's address first in X-Forwarded-For.
    map $http_x_forwarded_for $visitor {
        ~^(?<first>[^,\s]+) $first;
        default $remote_addr;
    }
    # Per visitor: CHAT_PER_MINUTE (start.sh, default 3) questions per minute, burst 3. All visitors:
    # CHAT_TOTAL_PER_MINUTE (default 4), so a crowd cannot use up the LLM's tokens per minute.
    limit_req_zone $visitor zone=per_visitor:1m rate=__CHAT_PER_MINUTE__r/m;
    limit_req_zone $server_name zone=everyone:64k rate=__CHAT_TOTAL_PER_MINUTE__r/m;
    limit_req_status 429;

    server {
        listen 7860;
        server_name scitech;
        root /app/ui;
        proxy_connect_timeout 5s;

        location = /health {
            proxy_pass http://127.0.0.1:8000;
        }

        location = /chat {
            limit_req zone=per_visitor burst=3 nodelay;
            limit_req zone=everyone burst=5;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location = /feedback {
            limit_req zone=per_visitor burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
