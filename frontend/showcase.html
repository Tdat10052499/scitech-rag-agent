<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design system · SciTech RAG</title>
    <script>
      // Apply the requested (?theme=) or stored theme before the first paint, so there is no flash.
      try {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("scitech-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/showcase/main.tsx"></script>
  </body>
</html>
