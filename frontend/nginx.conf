# Same-origin setup, like the Vite dev proxy (ADR 0004): the browser only talks to this server,
# so the backend needs no CORS. `backend` is the docker compose service name.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        proxy_pass http://backend:8000;
    }

    location ~ ^/(chat|feedback)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Server-sent events: pass each event on at once and allow long answers.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
