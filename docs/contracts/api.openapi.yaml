openapi: 3.0.3
info:
  title: SciTech RAG Agent API
  version: 0.3.0
  description: >
    Contract between frontend and backend. Frozen on 2026-10-15 (W1-D4-DAT-1, decisions in issue #7).
    Change only through an issue approved by the maintainer (DAT).
    0.2.1 (issue #36, wording only): a stream may be a single `error` event.
    0.3.0 (issue #147): `POST /feedback` for rating buttons and follow-up clicks.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /chat:
    post:
      summary: Ask a question; the answer is streamed as server-sent events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: |
            Stream of server-sent events (`text/event-stream`). Every `data:` line is JSON.
            Events, in order:
            1. `sources` (at most once, and when present always the first event): JSON array of
               `Source`; an empty array is allowed when no chunk passes `RETRIEVAL_MIN_SCORE`.
            2. `token` (zero or more): a JSON-encoded string with the next fragment of the answer
               (JSON encoding keeps newlines from breaking SSE framing).
            3. `followups` (at most once): JSON array of up to 4 strings.
            4. Exactly one of `done` (payload `Done`; a missing or empty payload means
               `insufficient_evidence: false`) or `error` (payload `Error`) ends the stream.
            A request that fails before sources are available (for example `retrieval_failed`)
            streams a single `error` event and nothing else.
            Citations: a marker `[n]` in the answer refers to the n-th element (1-based) of the
            `sources` array of the same response.
          content:
            text/event-stream:
              schema:
                type: string
        "422":
          description: >
            Invalid request (validation error), returned before any event is streamed.
  /feedback:
    post:
      summary: Record a rating of an answer or a follow-up, or a click on a follow-up
      description: >
        Appends one JSON line (the request fields plus `ts`, UTC) to `FEEDBACK_LOG`
        (default `<DATA_DIR>/logs/feedback.jsonl`). An unknown `message_id` is still recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "204":
          description: Recorded (no body).
        "422":
          description: >
            Invalid request, including `rating: click` with `target: answer`, `followup` with
            `target: answer`, or `target: followup` without `followup`.
components:
  schemas:
    FeedbackRequest:
      type: object
      required: [session_id, message_id, target, rating]
      properties:
        session_id:
          type: string
          description: Same as in `ChatRequest`.
        message_id:
          type: string
          minLength: 1
          description: Taken from the `done` event of the answer (equals the trace id of that request).
        target:
          type: string
          enum: [answer, followup]
        rating:
          type: string
          enum: [up, down, click]
          description: Thumbs up or down; `click` only with target `followup`.
        followup:
          type: string
          minLength: 1
          description: The follow-up suggestion as shown; required when `target` is `followup`.
    ChatRequest:
      type: object
      required: [session_id, message]
      properties:
        session_id:
          type: string
          description: Client-generated id that groups turns of one conversation.
        message:
          type: string
          minLength: 1
    Source:
      type: object
      description: One retrieved chunk shown as evidence; field names match chunk.schema.json.
      required: [chunk_id, doc_id, title, score]
      properties:
        chunk_id:
          type: string
        doc_id:
          type: string
        title:
          type: string
        url:
          type: string
        score:
          type: number
        snippet:
          type: string
        source:
          type: string
          enum: [arxiv, openalex, wikipedia]
        published_at:
          type: string
          format: date
          description: Date of the first public version (arXiv) or of the revision (Wikipedia).
        categories:
          type: array
          items:
            type: string
    Done:
      type: object
      description: Payload of the `done` event; all fields optional.
      properties:
        insufficient_evidence:
          type: boolean
          default: false
          description: True when the agent answered that the evidence is insufficient.
        message_id:
          type: string
          description: Id of this answer, used by rating buttons and `POST /feedback` (Week 6).
    Error:
      type: object
      description: Payload of the `error` event. New codes only through an issue.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [llm_unavailable, retrieval_failed, timeout, internal]
        message:
          type: string
