# Install once: pip install -r requirements-dev.txt && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check
        language: system
        types: [python]
      - id: nbstripout
        name: strip notebook outputs
        entry: nbstripout
        language: system
        files: \.ipynb$
