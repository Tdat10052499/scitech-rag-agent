# Local infrastructure. The backend and frontend are added as services once they exist.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2   # pinned (W3-D1-DAT-1); store tests ran against this version
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
