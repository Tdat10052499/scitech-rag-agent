name: Bootstrap project (labels and milestones)

# Run once from the Actions tab. Safe to re-run: existing labels are updated, and existing
# milestones get the due dates and descriptions below.
# Due dates follow docs/plan/calendar.md (replanned 2026-10-13, ADR 0010): each milestone is due at
# the end of its phase's gate day, 23:59:59 Asia/Saigon (16:59:59 UTC).
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'area:data', color: '1d76db', description: 'Pipelines: ingestion, cleaning, chunking, embedding' },
              { name: 'area:retrieval', color: '5319e7', description: 'Vector and keyword search, reranking' },
              { name: 'area:agent', color: '0e8a16', description: 'Agent loop, prompts, follow-up suggestions' },
              { name: 'area:backend', color: 'fbca04', description: 'FastAPI service and orchestration' },
              { name: 'area:frontend', color: 'f9d0c4', description: 'User interface' },
              { name: 'area:evaluation', color: 'b60205', description: 'Golden set, metrics, experiment reports' },
              { name: 'area:docs', color: '0075ca', description: 'Documentation, contracts, decisions' },
              { name: 'area:infra', color: '6f42c1', description: 'CI, Docker, environment' },
              { name: 'type:task', color: 'c5def5', description: 'Planned unit of work' },
              { name: 'type:bug', color: 'd73a4a', description: 'Defect' },
              { name: 'type:feature', color: 'a2eeef', description: 'New capability' },
              { name: 'priority:P0', color: 'b60205', description: 'Blocks other work' },
              { name: 'priority:P1', color: 'ff9f1c', description: 'Needed this phase' },
              { name: 'priority:P2', color: 'cfd3d7', description: 'Nice to have' },
              { name: 'status:blocked', color: '000000', description: 'Waiting on a dependency or decision' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
              } catch (e) {
                if (e.status !== 422) throw e;
                await github.rest.issues.updateLabel({ ...context.repo, ...l });
              }
            }

            // Phase n = milestone "Week n". Dates are the gate days in docs/plan/calendar.md.
            const weeks = {
              1: { gate: '2026-10-15', description: 'D01-D03: Scope, data sources, contracts, environment' },
              2: { gate: '2026-10-19', description: 'D04-D06: Batch data pipeline: download, clean, store' },
              3: { gate: '2026-10-22', description: 'D07-D09: Chunking, embeddings, vector store, hybrid search' },
              4: { gate: '2026-10-26', description: 'D10-D12: RAG MVP with LLM backend and citations (v0.4-mvp)' },
              5: { gate: '2026-10-28', description: 'D13-D14: Agent: query rewriting, evidence check, traces' },
              6: { gate: '2026-10-30', description: 'D15-D16: Complete UI, one-command stack, feature freeze (v0.6-rc)' },
              7: { gate: '2026-11-03', description: 'D17-D19: Experimental evaluation' },
              8: { gate: '2026-11-06', description: 'D20-D22: Report, demo, submission (v1.0)' },
            };
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              ...context.repo, state: 'all', per_page: 100,
            });
            for (const [n, w] of Object.entries(weeks)) {
              const title = `Week ${n}`;
              const params = { ...context.repo, title, description: w.description, due_on: `${w.gate}T16:59:59Z` };
              const found = existing.find((m) => m.title === title);
              if (found) {
                await github.rest.issues.updateMilestone({ ...params, milestone_number: found.number });
              } else {
                await github.rest.issues.createMilestone(params);
              }
            }
