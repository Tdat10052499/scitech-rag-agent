name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r backend/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
